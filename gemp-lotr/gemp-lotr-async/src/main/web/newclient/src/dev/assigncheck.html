<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>assignment alignment</title>
<link rel="stylesheet" href="../styles/board.css">
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px}
#board{height:70vh}.pass{color:#6E9B7A}.fail{color:#FF5240}</style></head>
<body><div id="board"></div><div id="out"></div>
<script type="module">
/**
 * A confirmed assignment merges into ONE boxed fight, away from the home
 * rows, and the whole box is a click target for choosing which skirmish to
 * resolve -- the playtest's ruling, replacing the old under-the-companion
 * offset alignment for CONFIRMED pairings. (Pre-confirm picks still align in
 * place; view/board.js alignAssignments.)
 */
import { createStore } from "../state/store.js";
import { decodeEvents } from "../net/protocol.js";
import { createBoard } from "../view/board.js";
import * as fixture from "./fixture.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const ok = (l, c, d) => { const e = document.createElement("div");
  e.className = c ? "pass" : "fail";
  e.textContent = (c ? "PASS  " : "FAIL  ") + l + (d ? "  -> " + d : "");
  out.appendChild(e); c ? pass++ : fail++; };

const boardEl = document.getElementById("board");
const store = createStore("asdf");
const board = createBoard(boardEl, store, {});
store.dispatchAll(decodeEvents(fixture.setup()));
store.dispatchAll(decodeEvents(fixture.shadowPhase()));

/**
 * Finish any FLIP in flight before measuring. `getBoundingClientRect` on an
 * animating element returns its ANIMATED position, so a board that has just
 * repainted reports where the cards came FROM. This cost a false failure here:
 * the alignment was correct and the test was reading the slide.
 */
const settle = () => {
  for (const n of boardEl.querySelectorAll(".card[data-card-id]")) {
    for (const a of n.getAnimations?.() ?? []) a.finish();
  }
};
const centre = (n) => { settle(); const r = n.getBoundingClientRect(); return r.left + r.width / 2; };
const minionRow = () => boardEl.querySelector('[data-band="minions"] .row');
const companions = () =>
  [...boardEl.querySelectorAll('[data-band="focusFree"] .card[data-card-id]')];

const minionsBefore = [...minionRow().children];
const comps = companions();
ok("the fixture gives us something to pair", minionsBefore.length >= 2 && comps.length >= 2,
   `${minionsBefore.length} minions, ${comps.length} companions`);

// Pair the LAST minion in the row with the FIRST companion, so a correct
// implementation has to reorder rather than nudge.
const minionId = minionsBefore[minionsBefore.length - 1].dataset.cardId;
const compId = comps[0].dataset.cardId;

store.dispatchAll(decodeEvents(
  `<events><ge type="AA" cardId="${compId}" otherCardIds="${minionId}"/></events>`));

// A CONFIRMED pairing merges into a boxed fight (playtest ruling: "a thin box
// should be drawn around them and they should be moved away from the
// fellowship"), leaving the home rows.
const box = () => boardEl.querySelector('[data-band="fights"] .fightbox');
ok("a confirmed assignment renders as one boxed fight", !!box());
ok("holding the companion and its minion together",
   !!box()?.querySelector(`.card[data-card-id="${compId}"]`) &&
   !!box()?.querySelector(`.card[data-card-id="${minionId}"]`));
ok("stacked VERTICALLY: companion in the top row, minion beneath",
   !!box()?.querySelector(`.fightbox-fp .card[data-card-id="${compId}"]`) &&
   !!box()?.querySelector(`.fightbox-sh .card[data-card-id="${minionId}"]`));
ok("and both have left their home rows",
   boardEl.querySelector(`[data-band="minions"] .card[data-card-id="${minionId}"]`) == null &&
   boardEl.querySelector(`[data-band="focusFree"] .card[data-card-id="${compId}"]`) == null);

// A second minion joins the SAME box rather than opening another.
const other = [...minionRow().children].find((n) => n.dataset.cardId !== minionId);
store.dispatchAll(decodeEvents(
  `<events><ge type="AA" cardId="${compId}" otherCardIds="${minionId},${other.dataset.cardId}"/></events>`));
ok("two minions on one companion share one box",
   boardEl.querySelectorAll('[data-band="fights"] .fightbox').length === 1 &&
   box().querySelectorAll('.card[data-card-id]').length === 3);

// Clicking ANYWHERE in the box picks the fight: with a selection decision
// naming the companion, a click on the box padding chooses it.
store.dispatchAll(decodeEvents(
  `<events><ge type="D" id="6" decisionType="CARD_SELECTION" text="Choose skirmish to resolve" participantId="asdf">` +
  `<parameter name="cardId" value="${compId}"/>` +
  `<parameter name="min" value="1"/><parameter name="max" value="1"/>` +
  `</ge></events>`));
box().click();
ok("clicking the box (not a card) selects the fight's companion",
   !!boardEl.querySelector(`.card[data-card-id="${compId}"].is-chosen`));
store.dispatchAll(decodeEvents(`<events><ge type="D" id="6"/></events>`));

// Unassigning dissolves the box and puts everyone home.
store.dispatchAll(decodeEvents(`<events><ge type="RA" cardId="${compId}"/></events>`));
ok("removing the assignment dissolves the fight",
   box() == null &&
   boardEl.querySelector(`[data-band="minions"] .card[data-card-id="${minionId}"]`) != null &&
   boardEl.querySelector(`[data-band="focusFree"] .card[data-card-id="${compId}"]`) != null);

// A retracted band FORCE-SHOWS while a decision makes its cards eligible --
// the rail shipped and immediately made assignment unclickable by hiding the
// minions row ("skirmish selection isn't working at all"). An offer must
// never be invisible.
{
  const tab = document.querySelector('.railtab[data-band="minions"]');
  ok("the minions row has a rail tab", !!tab);
  tab?.click();
  ok("clicking it retracts the row",
     document.querySelector('[data-band="minions"].band') == null);

  const someMinion = minionId;
  store.dispatchAll(decodeEvents(
    `<events><ge type="D" id="4" decisionType="ASSIGN_MINIONS" text="Assign minions" participantId="asdf">` +
    `<parameter name="freeCharacters" value="${compId}"/>` +
    `<parameter name="minions" value="${someMinion}"/>` +
    `</ge></events>`));
  const shown = document.querySelector('[data-band="minions"].band') != null;
  const clickable = document.querySelector(
    `[data-band="minions"] .card[data-card-id="${someMinion}"].is-eligible`) != null;
  ok("an assignment decision FORCE-SHOWS the retracted minions row", shown);
  ok("and its minion is eligible to click", clickable);

  store.dispatchAll(decodeEvents(`<events><ge type="D" id="4"/></events>`));
  ok("the retraction resumes once the decision resolves",
     document.querySelector('[data-band="minions"].band') == null);
  document.querySelector('.railtab[data-band="minions"]')?.click();  // restore
}

const r = document.createElement("div");
r.id = "result"; r.className = fail === 0 ? "pass" : "fail";
r.textContent = fail === 0 ? `RESULT: ALL PASS (${pass})` : `RESULT: ${fail} FAILED of ${pass + fail}`;
document.body.appendChild(r);
</script></body></html>
