<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>card picker</title>
<link rel="stylesheet" href="../styles/board.css">
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px}
#host{position:relative;height:60vh;border:1px solid #444}
.pass{color:#6E9B7A}.fail{color:#FF5240}</style></head>
<body><div id="host"></div><div id="out"></div>
<script type="module">
/**
 * Choosing among cards the client has never been sent.
 *
 * The decisions here are built to match what the engine actually sends, taken
 * from ArbitraryCardsSelectionDecision and ChooseArbitraryCardsEffect:
 * `cardId` is already "temp<i>", `blueprintId` is parallel to it, `selectable`
 * is a parallel true/false array, and the answer is the temp ids comma-joined.
 */
import { createPicker, pickable, boundsOf } from "../view/picker.js";
import { decodeEvents } from "../net/protocol.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const ok = (l, c, d) => { const e = document.createElement("div");
  e.className = c ? "pass" : "fail";
  e.textContent = (c ? "PASS  " : "FAIL  ") + l + (d ? "  -> " + d : "");
  out.appendChild(e); c ? pass++ : fail++; };

const sent = [];
const picker = createPicker(document.getElementById("host"),
  { onAnswer: (id, value) => sent.push([id, value]) });

/** A decision as the wire delivers it. */
const decision = (type, text, params) => ({
  id: 1, decisionType: type, shape: "cards", text, parameters: params
});

// ---- the wire format is decoded the way the server writes it ---------------

const wire = decodeEvents(
  `<events><ge type="D" id="7" decisionType="ARBITRARY_CARDS" text="Opponent's hand">` +
  `<parameter name="min" value="0"/><parameter name="max" value="0"/>` +
  `<parameter name="cardId" value="temp0"/><parameter name="cardId" value="temp1"/>` +
  `<parameter name="blueprintId" value="1_290"/><parameter name="blueprintId" value="1_310"/>` +
  `<parameter name="selectable" value="false"/><parameter name="selectable" value="false"/>` +
  `</ge></events>`)[0];
ok("a decision's parallel arrays survive decoding",
   wire.decision?.parameters?.cardId?.length === 2 &&
   wire.decision?.parameters?.blueprintId?.[1] === "1_310",
   JSON.stringify(wire.decision?.parameters?.blueprintId ?? null));

// ---- look at an opponent's hand: min 0, max 0, nothing selectable ----------

const look = decision("ARBITRARY_CARDS", "Opponent's hand", {
  min: ["0"], max: ["0"],
  cardId: ["temp0", "temp1", "temp2"],
  blueprintId: ["1_290", "1_310", "1_43"],
  selectable: ["false", "false", "false"]
});
picker.show(look);
const cards = () => [...picker.root.querySelectorAll(".pickgrid .card")];
ok("the whole hand is shown", cards().length === 3, `${cards().length} cards`);
ok("none of it is choosable", cards().every((c) => c.classList.contains("is-locked")));
ok("and the art is real", !!picker.root.querySelector(".pickgrid .card .c-art"),
   picker.root.querySelector(".c-art")?.getAttribute("src") ?? "none");

// This one is informational, but the engine is still WAITING on it.
const done = [...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent === "Done");
ok("it can still be answered, or the game stalls", !!done);
done?.click();
ok("and answering it sends an empty value", sent.length === 1 && sent[0][1] === "",
   JSON.stringify(sent));

// ---- discard a Shadow card from that hand: shown is not selectable ---------

sent.length = 0;
const discard = decision("ARBITRARY_CARDS", "Choose a card to discard", {
  min: ["1"], max: ["1"],
  cardId: ["temp0", "temp1", "temp2"],
  blueprintId: ["1_290", "1_310", "1_43"],
  selectable: ["false", "true", "false"]
});
picker.show(discard);
ok("cards are still all shown", cards().length === 3);
ok("but only the matching one is pickable",
   cards().filter((c) => c.classList.contains("is-pickable")).length === 1,
   cards().map((c) => c.classList.contains("is-pickable") ? "pick" : "lock").join(","));

const confirm = () => [...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent.startsWith("Confirm"));
ok("confirm is refused below the minimum", confirm()?.disabled === true);
ok("and there is no None button when min is 1",
   ![...picker.root.querySelectorAll(".pickbar button")].some((b) => b.textContent === "None"));

// Clicking a locked card must do nothing: the engine rejects the whole answer.
cards().find((c) => c.classList.contains("is-locked"))?.click();
ok("a locked card cannot be chosen", confirm()?.disabled === true);

cards().find((c) => c.classList.contains("is-pickable"))?.click();
ok("choosing the pickable one enables confirm", confirm()?.disabled === false);
confirm()?.click();
ok("and it answers with the temp id, not an index or a card id",
   sent.length === 1 && sent[0][1] === "temp1", JSON.stringify(sent));

// ---- the maximum is enforced here, not discovered as a rejection ----------

sent.length = 0;
picker.show(decision("ARBITRARY_CARDS", "Choose up to 2", {
  min: ["0"], max: ["2"],
  cardId: ["temp0", "temp1", "temp2"],
  blueprintId: ["1_290", "1_310", "1_43"],
  selectable: ["true", "true", "true"]
}));
cards().forEach((c) => c.click());          // try to pick all three
ok("never more than the maximum is chosen",
   picker.root.querySelectorAll(".pickgrid .card.is-chosen").length === 2,
   `${picker.root.querySelectorAll(".is-chosen").length} chosen of 3 clicked`);
ok("None is offered when min is 0",
   [...picker.root.querySelectorAll(".pickbar button")].some((b) => b.textContent === "None"));

// ---- helpers, and the two-argument constructor ----------------------------

ok("absent `selectable` means everything is selectable",
   pickable(decision("ARBITRARY_CARDS", "x", { cardId: ["temp0"], blueprintId: ["1_290"] }))
     .every((c) => c.selectable));
// ---- pick-one-or-pass STILL requires Confirm --------------------------------
// A click-commits shortcut for min 0 / max 1 shipped once and was revoked by
// the playtest within a game ("I didn't press confirm and it just went"): the
// starting fellowship plays a character per answer, and the last affordable
// pick auto-advances the phase, so an unconfirmed click can spend the whole
// budget. The click selects; only Confirm answers.
sent.length = 0;
const fellowship = decision("ARBITRARY_CARDS",
  "Starting fellowship - Choose next character or press DONE", {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1"],
  blueprintId: ["1_97", "1_311"],
  selectable: ["true", "true"]
});
picker.show(fellowship);
cards().find((c) => c.classList.contains("is-pickable"))?.click();
ok("min 0 max 1: a click only SELECTS -- nothing is sent",
   sent.length === 0, JSON.stringify(sent));
ok("the choice is visible while unconfirmed",
   picker.root.querySelectorAll(".is-chosen").length === 1);
[...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent.startsWith("Confirm"))?.click();
ok("Confirm sends the selected card",
   sent.length === 1 && sent[0][1] === "temp0", JSON.stringify(sent));
ok("and the window closes with the answer", !picker.isOpen);

// ---- several picks, one Confirm: the queue drains across re-asks -----------
// The engine asks the starting fellowship one character per decision; the
// player checks off several and Confirms once. The first goes now, the rest
// replay by blueprintId on each re-ask of the SAME question -- and a queued
// pick the budget has priced out (no longer selectable) is dropped, because
// the engine's greyed list outranks the plan.
sent.length = 0;
const SF = "Starting fellowship - Choose next character or press DONE";
const round1 = decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1", "temp2"],
  blueprintId: ["1_311", "1_365", "1_51"],
  selectable: ["true", "true", "true"]
});
picker.show(round1);
const pickables = () => cards().filter((c) => c.classList.contains("is-pickable"));
pickables()[0].click();
pickables()[2].click();
ok("the pick-one shape lets several be chosen",
   picker.root.querySelectorAll(".is-chosen").length === 2);
[...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent.startsWith("Confirm"))?.click();
ok("Confirm sends only the FIRST pick", sent.length === 1 && sent[0][1] === "temp0",
   JSON.stringify(sent));

const round2 = decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1"],
  blueprintId: ["1_365", "1_51"],
  selectable: ["false", "true"]
});
picker.show(round2);
ok("the re-ask auto-plays the queued pick that is still selectable",
   sent.length === 2 && sent[1][1] === "temp1", JSON.stringify(sent));
ok("without opening the window", !picker.isOpen);

const round3 = decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0"], blueprintId: ["1_365"], selectable: ["true"]
});
picker.show(round3);
ok("a spent queue shows the window again", picker.isOpen && sent.length === 2);
picker.hide();

sent.length = 0;
picker.show(decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1"],
  blueprintId: ["1_311", "1_365"],
  selectable: ["true", "true"]
}));
pickables()[0].click();
pickables()[1].click();
[...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent.startsWith("Confirm"))?.click();
picker.show(decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0"], blueprintId: ["1_365"], selectable: ["false"]
}));
ok("a queued pick the budget priced out is DROPPED and the window returns",
   sent.length === 1 && picker.isOpen, JSON.stringify(sent));
picker.hide();

sent.length = 0;
picker.show(decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1"],
  blueprintId: ["1_311", "1_51"], selectable: ["true", "true"]
}));
pickables()[0].click();
pickables()[1].click();
[...picker.root.querySelectorAll(".pickbar button")]
  .find((b) => b.textContent.startsWith("Confirm"))?.click();
picker.show(decision("ARBITRARY_CARDS", "A different question entirely", {
  min: ["0"], max: ["1"],
  cardId: ["temp0"], blueprintId: ["1_51"], selectable: ["true"]
}));
ok("a DIFFERENT question abandons the queue rather than answering it",
   sent.length === 1 && picker.isOpen, JSON.stringify(sent));
picker.hide();

// ---- the live budget: checking cards greys what no longer fits -------------
// The decision carries twilightCost per shown card and budgetRemaining; the
// picker greys, LIVE, any unchosen card whose cost exceeds what the current
// selection leaves -- so a combination the budget cannot fit is unpickable,
// instead of being silently dropped after Confirm.
sent.length = 0;
picker.show(decision("ARBITRARY_CARDS", SF, {
  min: ["0"], max: ["1"],
  cardId: ["temp0", "temp1", "temp2", "temp3"],
  blueprintId: ["1_311", "1_51", "1_365", "1_97"],
  selectable: ["true", "true", "true", "true"],
  twilightCost: ["2", "2", "4", "3"],
  budgetRemaining: ["4"]
}));
ok("the note shows the budget",
   picker.root.querySelector(".picknote")?.textContent.includes("4 twilight left"));
pickables()[0].click();                                     // Sam, cost 2
ok("after a 2-cost pick, 4- and 3-cost companions grey out live",
   cards().filter((c) => c.classList.contains("is-locked")).length === 2 &&
   picker.root.querySelector(".picknote")?.textContent.includes("2 twilight left"));
ok("a still-affordable companion stays pickable",
   !cards().find((c) => c.dataset.blueprintId === "1_51").classList.contains("is-locked"));
cards().find((c) => c.dataset.blueprintId === "1_365").click();
ok("a greyed card cannot join the selection",
   picker.root.querySelectorAll(".is-chosen").length === 1);
pickables().find((c) => c.classList.contains("is-chosen")).click();   // uncheck Sam
ok("unchecking restores the budget and the greys lift",
   cards().filter((c) => c.classList.contains("is-locked")).length === 0);
picker.hide();

const b = boundsOf(decision("ARBITRARY_CARDS", "x", { min: ["1"], max: ["3"] }));
ok("bounds are read off the decision", b.min === 1 && b.max === 3, JSON.stringify(b));

const r = document.createElement("div");
r.id = "result"; r.className = fail === 0 ? "pass" : "fail";
r.textContent = fail === 0 ? `RESULT: ALL PASS (${pass})` : `RESULT: ${fail} FAILED of ${pass + fail}`;
document.body.appendChild(r);
</script></body></html>
