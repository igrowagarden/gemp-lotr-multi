<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pile differential</title>
<link rel="stylesheet" href="../styles/board.css">
<style>
  body { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 10px; }
  iframe { position: absolute; left: -10000px; top: 900px; width: 1400px; height: 900px; border: 0; }
  #board { position: absolute; left: -10000px; top: 0; width: 1400px; height: 800px; }
  pre { white-space: pre-wrap; }
  .ok { color: #6E9B7A; } .bad { color: #FF5240; } .note { color: #B08D57; }
</style></head>
<body>
<iframe id="old" src="./oldharness.html"></iframe>
<div id="board"></div>
<pre id="out">RUNNING</pre>

<script type="module">
/**
 * The PILE differential: the first of the untested surfaces.
 *
 * `decisionfuzz.html` is the template and this follows it deliberately --
 * enumerate the space from the reference's source, drive both clients over
 * every cell, and carry a control that is proven to fire.
 *
 *   pilefuzz.html?config=player-private     (also player-public,
 *                                            spectator-private, spectator-public)
 *   pilefuzz.html?config=...&sabotage=dropdeck    NEGATIVE CONTROL
 *   pilefuzz.html?config=...&sabotage=extrapile   NEGATIVE CONTROL
 *   pilefuzz.html?config=...&sabotage=contents    NEGATIVE CONTROL
 *
 * `harness/pilerun.sh` runs all four configurations and all three controls and
 * checks each control fired where it should.
 *
 * WHY ONE CONFIGURATION PER PAGE LOAD. The reference builds every pile dialog
 * once, in `participant()`, from the role and `discardPublic` on the
 * PARTICIPANTS event. Those cannot be varied afterwards, and `boot()` may only
 * be called once per page -- booting twice re-parses the GENERATED game UI as
 * if it were the pregame markup and every later case reads garbage. That is
 * measured and written up in decisionfuzz.html; it is not re-litigated here.
 *
 * TWO THINGS ARE COMPARED, not one. Which piles each client OFFERS, and WHICH
 * CARDS each lists in them. Offers-only comparison is what let `CARD_SELECTION`
 * pass for a session while the sites were never lit.
 */
import { createStore } from "../state/store.js";
import { createPileViewer } from "../view/piles.js";
import { decodeEvents } from "../net/protocol.js";
import { pilesFor } from "../model/piles.js";
import { pileOf } from "../state/reduce.js";
import { CONFIGS, PILES, PLAYERS, baseBoard, referenceOffers, targetsFor }
  from "./pileshapes.js";

const q = new URLSearchParams(location.search);
const configName = q.get("config") ?? "player-private";
const sabotage = q.get("sabotage");
const config = CONFIGS[configName];
const out = document.getElementById("out");

const lines = [];
const say = (t, cls) => {
  lines.push(cls ? `<span class="${cls}">${t}</span>` : t);
  out.innerHTML = lines.join("\n");
};
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

if (!config) {
  out.textContent = `RESULT: 1 FAILED of 1 — unknown config "${configName}"`;
  throw new Error("unknown config");
}

async function ready(frame) {
  for (let i = 0; i < 300; i++) {
    if (frame.contentWindow?.OLD) return frame.contentWindow.OLD;
    await new Promise((r) => setTimeout(r, 50));
  }
  throw new Error("old harness never came up");
}
const frame = document.getElementById("old");
const OLD = await ready(frame);

const BASE = baseBoard(config);

// ------------------------------------------------------------- the old client
OLD.boot({ gameId: "1", participantId: config.viewer });
OLD.feedBatch(OLD.parseEvents(BASE));

/**
 * PREFLIGHT. Everything below reads the reference's dialog maps, so prove they
 * are populated at all before believing a single empty one. A run where
 * `participant()` never fired would report "the old client offers nothing" for
 * all forty cells, and that is indistinguishable from a real divergence -- it
 * is the shape of failure this project has shipped more than once.
 */
const ui = OLD.ui;
const mapNames = PILES.map((p) => p.oldMap);
const populated = mapNames.filter((m) => ui?.[m] && Object.keys(ui[m]).length > 0);
say(`config ${configName}  viewer=${config.viewer} discardPublic=${config.discardPublic}`);
say(`preflight: dialog maps with any entry: ${populated.length}/${mapNames.length}` +
    `  [${populated.join(", ")}]`, populated.length ? "note" : "bad");
if (!populated.length) {
  say("");
  say("RESULT: 1 FAILED of 1 — the oracle built NO pile dialogs at all; " +
      "nothing below would mean anything", "bad");
  out.innerHTML = lines.join("\n");
  throw new Error("preflight failed");
}

/** What the reference offers for a seat: which dialog maps hold a key for it. */
function oldOffers(target) {
  return PILES.filter(({ oldMap }) => !!ui?.[oldMap]?.[target]).map((p) => p.zone);
}

/**
 * What the reference LISTS in a pile.
 *
 * Read off the DIALOG'S DOM, not off the CardGroup. A `NormalCardGroup` holds
 * no card array at all -- `getCardElems` re-queries `$(".card", this.container)`
 * every layout and pulls each element's `.data("card")` (CardGroup.js:32-41).
 * Reading `group.cards` therefore returned `undefined` for every pile, which
 * came out as "old lists nothing" on all nine cells at once: a whole category
 * failing identically, which is this project's standing signal to suspect the
 * harness before either client. It was the harness.
 */
const $old = () => frame.contentWindow.$;
function oldContents(target, zone) {
  const kind = PILES.find((p) => p.zone === zone);
  const dialog = ui?.[kind?.oldMap]?.[target];
  if (!dialog) return [];
  const $ = $old();
  return $(".card", dialog).map(function () {
    return String($(this).data("card")?.cardId ?? "?");
  }).get().sort();
}

// ------------------------------------------------------------- the new client
const store = createStore(config.viewer);
const piles = createPileViewer(document.getElementById("board"), store);
store.dispatchAll(decodeEvents(BASE));

function newOffers(target) {
  let zones = pilesFor(store.getState(), target).map((p) => p.zone);
  // ---- negative controls, applied to the NEW client only, so a DIFF proves
  //      the comparison can see a difference at all.
  if (sabotage === "dropdeck") zones = zones.filter((z) => z !== "DECK");
  if (sabotage === "extrapile") zones = [...new Set([...zones, "ADVENTURE_DECK"])];
  return zones;
}

function newContents(target, zone) {
  let ids = pileOf(store.getState(), target, zone).map((c) => String(c.cardId));
  if (sabotage === "contents" && ids.length) ids = ids.slice(1);
  return ids.sort();
}

// ---------------------------------------------------------------- the compare
let pass = 0, diff = 0;
const controlFired = [];

for (const target of targetsFor(config)) {
  const expected = referenceOffers(config, target);
  const got = oldOffers(target);
  const mine = newOffers(target);

  // The oracle against its own transcription. If these disagree, the reading of
  // `participant()` in pileshapes.js is wrong and every verdict below is built
  // on it -- so this is reported as a failure of the HARNESS, loudly, rather
  // than being quietly folded into the client comparison.
  if (!eq([...expected].sort(), [...got].sort())) {
    say(`  HARNESS  ${target}: pileshapes.js says [${expected}] but the oracle ` +
        `built [${got}] — the transcription of participant() is wrong`, "bad");
    diff++;
    continue;
  }

  if (eq([...got].sort(), [...mine].sort())) {
    pass++;
    say(`  ok       ${target} offers [${got.join(", ") || "none"}]`, "ok");
  } else {
    diff++;
    if (sabotage) controlFired.push(`${target}:offers`);
    say(`  OFFERS   ${target}: old [${got.join(", ") || "none"}] ` +
        `vs new [${mine.join(", ") || "none"}]`, "bad");
  }

  // Contents, for every pile BOTH agree is reachable. Comparing a pile only one
  // of them offers would report the same divergence twice and hide whether the
  // contents themselves ever differ.
  for (const zone of got.filter((z) => mine.includes(z))) {
    const o = oldContents(target, zone);
    const n = newContents(target, zone);
    if (eq(o, n)) {
      pass++;
    } else {
      diff++;
      if (sabotage) controlFired.push(`${target}:${zone}`);
      say(`  CONTENTS ${target} ${zone}: old [${o.join(",")}] vs new [${n.join(",")}]`, "bad");
    }
  }
}

say("");
if (sabotage) {
  say(`control ${sabotage} fired on: ${controlFired.join(", ") || "NOTHING"}`,
      controlFired.length ? "note" : "bad");
}
const total = pass + diff;
say(diff === 0 ? `RESULT: ALL PASS (${total})` : `RESULT: ${diff} DIFF of ${total}`,
    diff === 0 ? "ok" : "bad");
</script></body></html>
