<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>replay controls differential</title>
<link rel="stylesheet" href="../styles/board.css">
<style>
  body { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 10px; }
  iframe { position: absolute; left: -10000px; top: 900px; width: 1400px; height: 900px; border: 0; }
  pre { white-space: pre-wrap; }
  .ok { color: #6E9B7A; } .bad { color: #FF5240; } .note { color: #B08D57; }
</style></head>
<body>
<iframe id="old" src="./oldharness.html"></iframe>
<pre id="out">RUNNING</pre>

<script type="module">
/**
 * The REPLAY CONTROLS differential: pacing, and the play/pause contract.
 *
 *   replayfuzz.html                      baseline
 *   replayfuzz.html?sabotage=noclamp     NEGATIVE CONTROL
 *   replayfuzz.html?sabotage=inverted    NEGATIVE CONTROL
 *   replayfuzz.html?sabotage=autoplay    NEGATIVE CONTROL
 *
 * WHAT IS AND IS NOT COMPARABLE. The reference's replay panel is three buttons
 * (gameUi.js:153-180): slower, faster, play/pause. It has no scrubber, no
 * step-back and no seek -- `playNextReplayEvent` walks forward and only
 * forward. This client has all three extras. Those are a SUPERSET, not a
 * disagreement, and a differential that flagged them would be reporting a
 * design decision as a defect. So what is compared is the part both have:
 *
 *   1  the speed model -- its bounds, and its direction
 *   2  the play/pause contract -- that a replay starts PAUSED and toggles
 *
 * THE SPEED MODEL IS INVERTED and that is the thing worth catching.
 * `replaySpeed` is a duration MULTIPLIER (gameAnimations.js:17 returns
 * `origValue * replaySpeed`), so "slower" DOUBLES it and "faster" HALVES it.
 * Implemented from the button labels alone it comes out backwards, and a replay
 * whose speed buttons are swapped still looks like it works.
 *
 * The reference paces animation DURATIONS; this client advances one event per
 * interval and applies the same multiplier to the INTERVAL. Same control, same
 * bounds, same inversion, applied to what each client actually paces on -- so
 * the multiplier SEQUENCE is compared, not the milliseconds.
 *
 * `OLD.setReplayMode(true)` is required and must precede boot(): the panel is
 * built from the flag at construction. Without it the reference has no replay
 * controls at all and this page would report it offering none.
 */
import { slower, faster, SPEED_DEFAULT, SPEED_MIN, SPEED_MAX }
  from "../model/replayctl.js";

const q = new URLSearchParams(location.search);
const sabotage = q.get("sabotage");
const out = document.getElementById("out");
const lines = [];
const say = (t, cls) => { lines.push(cls ? `<span class="${cls}">${t}</span>` : t);
                          out.innerHTML = lines.join("\n"); };
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

async function ready(frame) {
  for (let i = 0; i < 300; i++) {
    if (frame.contentWindow?.OLD) return frame.contentWindow.OLD;
    await new Promise((r) => setTimeout(r, 50));
  }
  throw new Error("old harness never came up");
}
const frame = document.getElementById("old");
const OLD = await ready(frame);

OLD.setReplayMode(true);
OLD.boot({ gameId: "1", participantId: "asdf" });
OLD.feedBatch(OLD.parseEvents(
  `<gameState><ge type="P" participantId="asdf" allParticipantIds="asdf,qwer" ` +
  `discardPublic="false"/><ge type="PP" participantId="asdf" index="0"/>` +
  `<ge type="PP" participantId="qwer" index="1"/></gameState>`));

const ui = OLD.ui;
const $ = frame.contentWindow.$;

/**
 * PREFLIGHT. Every verdict rests on the replay panel having been built. If
 * `setReplayMode` were forgotten or ineffective the buttons would be absent,
 * every click would land on nothing, and the run would report the reference
 * never changing speed -- indistinguishable from a reference with no speed
 * control, which is the opposite of the truth.
 */
const haveSlower = $("#slowerButton").length > 0;
const haveFaster = $("#fasterButton").length > 0;
const havePlay = $("#replayButton").length > 0;
say(`preflight: replayMode=${ui.replayMode} slower=${haveSlower} ` +
    `faster=${haveFaster} play=${havePlay}`,
    haveSlower && haveFaster && havePlay ? "note" : "bad");
if (!(haveSlower && haveFaster && havePlay)) {
  say("");
  say("RESULT: 1 FAILED of 1 — the oracle built no replay controls; nothing " +
      "below would mean anything", "bad");
  throw new Error("preflight failed");
}

let pass = 0, diff = 0;
const fired = [];
const check = (label, a, b) => {
  if (eq(a, b)) { pass++; say(`  ok       ${label}`, "ok"); }
  else {
    diff++;
    if (sabotage) fired.push(label);
    say(`  DIFF     ${label}: old ${JSON.stringify(a)} vs new ${JSON.stringify(b)}`, "bad");
  }
};

// ------------------------------------------------------------------- speed
/** Click a reference button n times and report the multiplier after each. */
function oldSequence(button, n) {
  ui.animations.replaySpeed = SPEED_DEFAULT;
  const seq = [];
  for (let i = 0; i < n; i++) {
    $(button).click();
    seq.push(ui.animations.replaySpeed);
  }
  return seq;
}

function newSequence(step, n) {
  let s = SPEED_DEFAULT;
  const seq = [];
  for (let i = 0; i < n; i++) {
    // ---- negative controls, on the NEW client's model only.
    if (sabotage === "inverted") s = step === slower ? faster(s) : slower(s);
    else if (sabotage === "noclamp") s = step === slower ? s * 2 : s / 2;
    else s = step(s);
    seq.push(s);
  }
  return seq;
}

say("");
say("--- speed: six presses, which is two past the clamp in each direction");
check("slower doubles and stops at the ceiling",
      oldSequence("#slowerButton", 6), newSequence(slower, 6));
check("faster halves and stops at the floor",
      oldSequence("#fasterButton", 6), newSequence(faster, 6));

// The bounds, named. The sequences above would also catch a wrong clamp, but
// not say which end moved.
ui.animations.replaySpeed = SPEED_DEFAULT;
for (let i = 0; i < 8; i++) $("#slowerButton").click();
check("the slowest the reference will go", ui.animations.replaySpeed,
      sabotage === "noclamp" ? 256 : SPEED_MAX);
ui.animations.replaySpeed = SPEED_DEFAULT;
for (let i = 0; i < 8; i++) $("#fasterButton").click();
check("the fastest the reference will go", ui.animations.replaySpeed,
      sabotage === "noclamp" ? 1 / 256 : SPEED_MIN);

// The inversion, stated as its own assertion so a reader of a failure sees the
// claim rather than a pair of arrays.
ui.animations.replaySpeed = SPEED_DEFAULT;
$("#slowerButton").click();
check('"slower" makes the multiplier BIGGER', ui.animations.replaySpeed > SPEED_DEFAULT,
      sabotage === "inverted" ? faster(SPEED_DEFAULT) > SPEED_DEFAULT
                              : slower(SPEED_DEFAULT) > SPEED_DEFAULT);

// -------------------------------------------------------------- play/pause
say("");
say("--- play/pause");

// The reference binds #replayButton's handler inside processXmlReplay, not at
// init, so a replay document has to arrive before the button does anything.
const replayXml = new DOMParser().parseFromString(
  `<gameReplay><ge type="PP" participantId="asdf" index="0"/></gameReplay>`,
  "text/xml");
ui.processXmlReplay(replayXml, false);

// A replay opens PAUSED in both. Ours has no timer running until Play is
// pressed; the reference's `replayPlay` starts false (gameUi.js:95) and
// `playNextReplayEvent` does nothing while `shouldPlay()` is false.
check("a replay starts paused", ui.replayPlay === true,
      sabotage === "autoplay" ? true : false);

$("#replayButton").click();
check("Play starts it", ui.replayPlay === true, sabotage === "autoplay" ? false : true);

$("#replayButton").click();
check("and pressing it again pauses", ui.replayPlay === true,
      sabotage === "autoplay" ? true : false);

say("");
if (sabotage) {
  say(`control ${sabotage} fired on: ${fired.length ? fired.length + " check(s)" : "NOTHING"}`,
      fired.length ? "note" : "bad");
}
const total = pass + diff;
say(diff === 0 ? `RESULT: ALL PASS (${total})` : `RESULT: ${diff} DIFF of ${total}`,
    diff === 0 ? "ok" : "bad");
</script></body></html>
