<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>nav check</title>
<link rel="stylesheet" href="../styles/board.css">
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px}
#board{height:60vh}.pass{color:#6E9B7A}.fail{color:#FF5240}</style></head>
<body><div id="board"></div><div id="out"></div>
<script type="module">
import { createStore } from "../state/store.js";
import { decodeEvents } from "../net/protocol.js";
import { createBoard } from "../view/board.js";
import * as fixture from "./fixture.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const ok = (l, c, d) => { const e = document.createElement("div");
  e.className = c ? "pass" : "fail";
  e.textContent = (c ? "PASS  " : "FAIL  ") + l + (c || !d ? "" : "  -> " + d);
  out.appendChild(e); c ? pass++ : fail++; };

const store = createStore("asdf");
const board = createBoard(document.getElementById("board"), store, {});
store.dispatchAll(decodeEvents(fixture.setup()));

const key = (k, target = document) =>
  target.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));

const start = board.focusId;
ok("a seat is focused to begin with", !!start, String(start));

key("ArrowRight");
const afterRight = board.focusId;
ok("ArrowRight moves to another seat", afterRight && afterRight !== start,
   `${start} -> ${afterRight}`);

key("ArrowLeft");
ok("ArrowLeft comes back", board.focusId === start, `${afterRight} -> ${board.focusId}`);

// The on-screen edge arrows are GONE by playtest ruling: arrow keys and the
// seat chips are the navigation. Their absence is the assertion now.
ok("no edge arrows render", document.querySelector(".navarrow") == null);

// wrap all the way round and land where we started
const seen = new Set([board.focusId]);
for (let i = 0; i < 8; i++) { key("ArrowRight"); seen.add(board.focusId); }
ok("it cycles rather than stopping at the end", seen.size >= 3, [...seen].join(","));

// typing must not move the board
const input = document.createElement("input");
document.body.appendChild(input);
const before = board.focusId;
key("ArrowRight", input);
ok("typing in a field does not move the board", board.focusId === before);
input.remove();

// a skirmish suspends the focus
store.dispatchAll(decodeEvents(fixture.shadowPhase()));
store.dispatchAll(decodeEvents(fixture.skirmish()));
const during = board.focusId;
key("ArrowRight");
ok("keys are ignored during a skirmish", board.focusId === during);
ok("and no arrows exist to disagree", document.querySelector(".navarrow") == null);

store.dispatchAll(decodeEvents(fixture.endSkirmish()));
key("ArrowRight");
ok("and they work again once it ends", board.focusId !== during);

// The boundary between two rows DRAGS to resize them (playtest request:
// "make the horizontal boundary lines adjustable between them"). The drag
// trades flex weight between exactly the two neighbours, and the adjusted
// weights survive a repaint -- listeners live on the document because a
// five-player game repaints mid-drag.
{
  const divider = document.querySelector(".banddivider");
  ok("a divider renders between two card-bearing rows", !!divider);
  const above = divider?.previousElementSibling, below = divider?.nextElementSibling;
  ok("its neighbours are bands",
     above?.classList.contains("band") && below?.classList.contains("band"),
     `${above?.className} / ${below?.className}`);
  const wA0 = parseFloat(getComputedStyle(above).flexGrow);
  const wB0 = parseFloat(getComputedStyle(below).flexGrow);
  divider.dispatchEvent(new PointerEvent("pointerdown",
    { button: 0, clientY: 300, bubbles: true }));
  document.dispatchEvent(new PointerEvent("pointermove",
    { clientY: 360, bubbles: true }));
  const wA1 = parseFloat(above.style.flexGrow), wB1 = parseFloat(below.style.flexGrow);
  ok("dragging down grows the row above and shrinks the one below",
     wA1 > wA0 && wB1 < wB0, `${wA0}->${wA1} / ${wB0}->${wB1}`);
  ok("the pair trades weight, the rest of the board keeps its share",
     Math.abs((wA1 + wB1) - (wA0 + wB0)) < 0.001,
     `pair ${wA0 + wB0} -> ${wA1 + wB1}`);
  document.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));

  // A repaint rebuilds every band; the dragged heights must come back.
  store.dispatchAll(decodeEvents(`<events><ge type="TP" count="7"/></events>`));
  const again = document.querySelector(`.band[data-band="${above.dataset.band}"]`);
  ok("the adjusted height survives a repaint",
     Math.abs(parseFloat(getComputedStyle(again).flexGrow) - wA1) < 0.001,
     `${getComputedStyle(again).flexGrow} vs ${wA1}`);
}

// Elimination is ANNOUNCED: dropped from the participant list, the banner
// renders and stays. The first playtest elimination was silent.
store.dispatchAll(decodeEvents(
  `<events><ge type="M" message="asdf lost due to: Corrupted before game started"/>` +
  `<ge type="P" allParticipantIds="carol,dave,qwer,Librarian"/></events>`));
const banner = document.querySelector(".elimbanner");
ok("being eliminated raises the banner", !!banner);
ok("with the reason on it", banner?.textContent.includes("Corrupted before game started"));

const r = document.createElement("div");
r.id = "result"; r.className = fail === 0 ? "pass" : "fail";
r.textContent = fail === 0 ? `RESULT: ALL PASS (${pass})` : `RESULT: ${fail} FAILED of ${pass + fail}`;
document.body.appendChild(r);
</script></body></html>
