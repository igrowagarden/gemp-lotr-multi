<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>script probe</title>
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px}
iframe{position:absolute;left:-10000px;top:900px;width:1200px;height:800px;border:0}
.yes{color:#FF5240}.no{color:#6E9B7A}</style></head>
<body><iframe id="old" src="./oldharness.html"></iframe><pre id="out">RUNNING</pre>
<script type="module">
/**
 * Does the REFERENCE client execute a <script> that arrives in a log message?
 *
 * logfuzz reports that it does, but through a chat-box SINK this project built.
 * A sink is a harness construct, and "the harness made it happen" is the single
 * most common way this project has been wrong. So this asks the question four
 * ways, three of which do not involve the sink at all:
 *
 *   1  jQuery 1.6.2 in the reference's own frame, parse only -- no insertion
 *   2  jQuery 1.6.2 in that frame, parsed AND appended to the document
 *   3  the reference's real ChatBoxUI.prototype.appendMessage, borrowed onto a
 *      bare object, which is the code path the client itself runs
 *   4  the whole feed path: an M game event through feedBatch, as a server sends
 *
 * If 2 fires, the mechanism is jQuery's and belongs to the reference regardless
 * of anything here. 1 separates "parsing is enough" from "insertion does it",
 * which decides how the upstream fix would have to be written.
 */
const out = document.getElementById("out");
const frame = document.getElementById("old");
const lines = [];
const say = (t, cls) => { lines.push(cls ? `<span class="${cls}">${t}</span>` : t);
                          out.innerHTML = lines.join("\n"); };

async function ready() {
  for (let i = 0; i < 300; i++) {
    if (frame.contentWindow?.OLD) return frame.contentWindow.OLD;
    await new Promise((r) => setTimeout(r, 50));
  }
  throw new Error("old harness never came up");
}
const OLD = await ready();
const W = frame.contentWindow;
const $ = W.$;

say(`jQuery in the reference frame: ${$.fn.jquery}`);
say("");

const mark = (n) => `<scr` + `ipt>window.__p${n} = 1;</scr` + `ipt>`;
const fired = (n) => W[`__p${n}`] !== undefined;

// 1. Parse only. jQuery builds the nodes but nothing is inserted.
$("<div class='message'>" + mark(1) + "</div>");
say(`1  parse only, never inserted        -> ${fired(1) ? "EXECUTED" : "inert"}`,
    fired(1) ? "yes" : "no");

// 2. Parsed and appended, which is what appendMessage does with its line.
const host = $("<div></div>");
$(W.document.body).append(host);
host.append($("<div class='message'>" + mark(2) + "</div>"));
say(`2  parsed then .append()ed           -> ${fired(2) ? "EXECUTED" : "inert"}`,
    fired(2) ? "yes" : "no");

// 3. The reference's OWN method, borrowed onto a bare object. No sink, no
//    proxy -- just ChatBoxUI.prototype.appendMessage with the fields it reads.
const div = $("<div></div>");
$(W.document.body).append(div);
const bare = {
  chatMessagesDiv: div,
  hiddenClasses: [],
  maxMessageCount: 500,
  everyoneRegex: W.ChatBoxUI.prototype.everyoneRegex,
  pingRegex: null, mentionRegex: null,
  isShowingMessageClass: () => true,
  scrollChatToBottom: () => {},
  checkForEnd: () => {}
};
W.ChatBoxUI.prototype.appendMessage.call(bare, mark(3), "gameMessage");
say(`3  ChatBoxUI.prototype.appendMessage -> ${fired(3) ? "EXECUTED" : "inert"}`,
    fired(3) ? "yes" : "no");

// 4. The whole path a server message actually takes.
OLD.setRealChatBox(true);
OLD.boot({ gameId: "1", participantId: "asdf" });
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
OLD.feedBatch(OLD.parseEvents(
  `<gameState><ge type="M" message="${esc(mark(4))}"/></gameState>`));
say(`4  an M game event through feedBatch -> ${fired(4) ? "EXECUTED" : "inert"}`,
    fired(4) ? "yes" : "no");

say("");
say(fired(2) && fired(3)
  ? "VERDICT: the mechanism is jQuery's and the reference's own appendMessage "
    + "runs it. Not an artefact of this project's sink."
  : "VERDICT: NOT reproduced outside the sink — the logfuzz claim is unsafe.");
say(`RESULT: parse=${fired(1)} append=${fired(2)} appendMessage=${fired(3)} feed=${fired(4)}`);
</script></body></html>
