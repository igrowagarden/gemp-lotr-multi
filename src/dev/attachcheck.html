<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>attachment check</title>
<link rel="stylesheet" href="../styles/board.css">
<style>body{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px}
#board{height:70vh}.pass{color:#6E9B7A}.fail{color:#FF5240}.note{color:#B08D57}</style></head>
<body><div id="board"></div><div id="out"></div>
<script type="module">
/**
 * Attachments, and the corner case nothing had ever exercised: a card owned by
 * ONE player attached to a card owned by ANOTHER, across sides -- a Shadow
 * condition on a Free Peoples companion.
 *
 * Why it needed its own suite. `fixture.js` had no attachments at all, and the
 * only ones in `live_capture.xml` are five instances of `1_2` -- The One Ring,
 * on its own owner's ring-bearer. Same owner, same side, every time. So the
 * cross-side case had never been through this client in any test or any
 * recording, and "it probably works" was the whole of the evidence.
 *
 * Three separate questions, which are easy to run together and wrong to
 * conflate:
 *
 *   1  does it DRAW, and on the right host?
 *   2  does the completeness invariant account for it?
 *   3  what does the side FILTER do with it?
 *
 * The third has no right answer recorded anywhere, so this suite MEASURES it
 * and states what it found rather than asserting a behaviour nobody chose. See
 * the note where it is measured.
 */
import { createStore } from "../state/store.js";
import { decodeEvents } from "../net/protocol.js";
import { createBoard } from "../view/board.js";
import { allCards, bandContext, fpId } from "../state/reduce.js";
import { checkComplete, ridesOnParent } from "../model/zones.js";
import * as fixture from "./fixture.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const ok = (l, c, d) => { const e = document.createElement("div");
  e.className = c ? "pass" : "fail";
  e.textContent = (c ? "PASS  " : "FAIL  ") + l + (c || !d ? "" : "  -> " + d);
  out.appendChild(e); c ? pass++ : fail++; };
const note = (t) => { const e = document.createElement("div");
  e.className = "note"; e.textContent = "      " + t; out.appendChild(e); };

const VIEWER = "asdf";
const store = createStore(VIEWER);
const board = createBoard(document.getElementById("board"), store, {});
store.dispatchAll(decodeEvents(fixture.setup()));

// A companion belonging to SOMEONE ELSE, so the attachment crosses an owner
// boundary as well as a side one. Read out of state rather than hardcoded --
// the fixture assigns ids from a counter and they move whenever it changes.
const s0 = store.getState();
// NOT merely "someone else's". Side filtering exists on exactly ONE band --
// `focusFree`, the focused opponent's companions (layout/bands.js:24-30); every
// other band has no `dimWhen` at all. A host in the CONTESTED fellowship
// therefore sits in a band the filter never touches, and measuring the filter
// against it reports "lit" under all four settings while proving nothing. The
// first version of this suite did exactly that, and only the control below --
// "can this measurement ever say `dimmed`?" -- caught it.
const contestedOwner = fpId(s0);
const host = allCards(s0).find((c) => c.zone === "FREE_CHARACTERS" &&
                                      c.owner !== VIEWER && c.owner !== contestedOwner);
const ownHost = allCards(s0).find((c) => c.zone === "FREE_CHARACTERS" && c.owner === VIEWER);
ok("the fixture has a companion belonging to another seat to attach to", !!host,
   host ? `card ${host.cardId} of ${host.owner}` : "none found");
if (!host) throw new Error("no host");

// `1_170` stands in for a Shadow condition; what matters is the OWNER and the
// zone, which is what the client routes on -- the blueprint only picks the art.
const SHADOW_OWNER = fixture.PLAYERS.find((p) => p !== host.owner && p !== VIEWER);
const RIDER = 9001, OWN_RIDER = 9002;
store.dispatchAll(decodeEvents(
  `<gameState>` +
  `<ge type="PCIP" cardId="${RIDER}" blueprintId="1_170" zone="ATTACHED" ` +
  `participantId="${SHADOW_OWNER}" targetCardId="${host.cardId}" targetType="attached"/>` +
  `<ge type="PCIP" cardId="${OWN_RIDER}" blueprintId="1_2" zone="ATTACHED" ` +
  `participantId="${VIEWER}" targetCardId="${ownHost.cardId}" targetType="attached"/>` +
  `</gameState>`));

const s = store.getState();
const rider = s.cards[RIDER];

// ---------------------------------------------------------------- 1. the state
ok("the attachment is in state", !!rider);
ok("it knows its host", rider?.attachedTo === host.cardId,
   `attachedTo=${rider?.attachedTo} wanted ${host.cardId}`);
ok("its owner is NOT the host's owner -- the case being tested",
   rider?.owner === SHADOW_OWNER && rider.owner !== host.owner,
   `rider ${rider?.owner} vs host ${host.owner}`);
ok("it rides its parent rather than claiming a band", ridesOnParent(rider) === true);

// ------------------------------------------------------------- 2. completeness
const ctx = { ...bandContext(s, board.focusId), viewerId: s.viewerId, fpId: fpId(s) };
const complete = checkComplete(allCards(s), ctx);
ok("the completeness invariant is satisfied with it on the board", complete.ok,
   complete.missing.map((c) => c.cardId).join(","));

// ------------------------------------------------------------------ 3. drawing
// Focus the host's seat, or its band is not on screen and the rider's absence
// would mean nothing.
board.focus(host.owner);
// `all` first: the default `auto` HIDES this band (see the filter section), so
// the drawing assertions would otherwise be measuring the filter instead of the
// drawing. Four of them failed exactly that way before this line existed.
board.setFilter("all");
const node = () => document.querySelector(`#board .card[data-card-id="${RIDER}"]`);
ok("it is DRAWN once its host's seat is focused", !!node(),
   node() ? "" : "no node");

const hostNode = document.querySelector(`#board .card[data-card-id="${host.cardId}"]`);
ok("its host is drawn too", !!hostNode);
// The contract is a shared `.cardgroup` wrapper, NOT nesting: riders are drawn
// BEFORE the host inside it and overlapped, so the host paints on top and its
// attachments peek out to the left (board.js:374-386). The first version of
// this assertion tested `hostNode.contains(rider)` and failed -- the TEST was
// wrong, not the client, and asserting a mechanism nobody implemented is how a
// suite starts arguing with correct code.
const group = node()?.parentElement;
ok("host and attachment share one .cardgroup wrapper",
   !!group && group.classList.contains("cardgroup") && group.contains(hostNode),
   `parent=${group?.className}`);
ok("the attachment is drawn BEFORE its host, so the host paints on top",
   !!group && [...group.children].indexOf(node()) < [...group.children].indexOf(hostNode),
   group ? [...group.children].map((n) => n.dataset.cardId).join(",") : "");

// The same-owner attachment -- the One Ring case, the only one any recording
// contains -- must still work. A fix for the cross-side case that broke this
// would be trading a hypothetical for a real one.
board.focus(null);
const ownNode = document.querySelector(`#board .card[data-card-id="${OWN_RIDER}"]`);
ok("a same-owner attachment still draws (the One Ring case)", !!ownNode);

// ------------------------------------------------------------- 4. the FILTER
//
// MEASURED, NOT ASSERTED. The four-way filter dims whole BANDS
// (`dimWhen`, layout/bands.js), and a rider is drawn inside its host rather
// than in a band of its own -- so it inherits the dimming of the band its HOST
// sits in, which for a Shadow condition on a companion is the Free Peoples
// band. Its own side never enters into it.
//
// Nobody chose that; it falls out of riders bypassing `shouldDraw`. It is also
// the same root cause as the open `GameEvent._side` item: ATTACHED carries
// `side: null`, so there is nothing to filter ON even if the filter reached
// individual cards. Recorded here so the behaviour is written down rather than
// rediscovered, and so a deliberate change to it has something to change FROM.
board.focus(host.owner);
const dimming = {};
for (const mode of ["auto", "fp", "shadow", "all"]) {
  board.setFilter(mode);
  const n = node();
  const band = n?.closest(".band");
  // `is-dim`, not `dim` (board.js:273). The first version of this read the
  // wrong class name, so nothing was ever dimmed and every filter reported
  // "lit" -- a clean-looking table that measured nothing. Asserted below rather
  // than trusted, so a rename cannot quietly restore that.
  dimming[mode] = band ? (band.classList.contains("is-dim") ? "dimmed" : "lit") : "not drawn";
}
note(`filter -> the cross-side rider: ${JSON.stringify(dimming)}`);

// THE FINDING, asserted so it cannot drift unnoticed.
//
// "Dimming" does not dim: a filtered band renders `N hidden` and returns
// WITHOUT its cards (board.js:283-286). So the four-way filter HIDES the
// focused opponent's companions -- and a Shadow condition attached to one is
// hidden along with its host, because riders are drawn inside the host's band
// and have no band of their own.
//
// For this exact card that is backwards: a Shadow player filtering to "Shadow"
// to see the shadow-side picture loses sight of their OWN condition on an enemy
// companion. There is no oracle for it -- the reference has no such filter --
// so this is this client's own corner case, and it is recorded rather than
// quietly changed. Changing it is a DESIGN decision (DESIGN.md owns the filter)
// and needs `_side` or a per-card rule to do properly.
// THE RULE, now decided and implemented (DESIGN.md, "Filtering opponents by
// side"): a filtered band still shows a card CARRYING AN ATTACHMENT OWNED BY
// SOMEBODY ELSE. The filter puts away the focused seat's OWN cards; a Shadow
// condition on their companion is not theirs, it is yours, and hiding the
// companion took your own card off the screen at the moment you asked to see
// the shadow side. It cannot be shown detached either -- a possession means
// "this, on that" -- so the host is kept and the rest of the band is put away.
ok("a cross-side attachment survives EVERY filter setting",
   Object.values(dimming).every((v) => v !== "not drawn"), JSON.stringify(dimming));
note("Its host is kept with it: a condition shown without the companion it");
note("afflicts would be worse than hidden. The rest of the band is still put");
note("away, and the band says how many.");

// The band must still be FILTERING. If the rule leaked into "never hide
// anything", this suite would pass while the filter had silently stopped
// working -- so prove the other companions really are gone.
board.setFilter("shadow");
const bandNode = node()?.closest(".band");
const shown = bandNode ? bandNode.querySelectorAll(".row .card").length : 0;
const others = allCards(store.getState())
  .filter((c) => c.zone === "FREE_CHARACTERS" && c.owner === host.owner).length;
ok("the filter still hides the rest of the band -- the rule is narrow",
   shown < others + 1, `showing ${shown} of ${others} companions + rider`);
ok("and the band says how many it put away",
   /hidden/.test(bandNode?.textContent ?? ""), bandNode?.textContent?.slice(0, 80));
board.setFilter("all");

// --------------------------------------------------- 5. a host that is absent
// A rider whose host is not on the board must not appear loose. `shouldDraw`
// returns false for riders, so the completeness check deliberately ignores
// them -- meaning nothing else would catch this.
store.dispatchAll(decodeEvents(
  `<gameState><ge type="PCIP" cardId="9003" blueprintId="1_170" zone="ATTACHED" ` +
  `participantId="${SHADOW_OWNER}" targetCardId="88888" targetType="attached"/></gameState>`));
const orphan = document.querySelector(`#board .card[data-card-id="9003"]`);
ok("an attachment whose host is not on the board draws nowhere", !orphan,
   orphan ? `parent=${orphan.parentElement?.className}` : "");
const c2 = checkComplete(allCards(store.getState()),
                         { ...bandContext(store.getState(), board.focusId),
                           viewerId: VIEWER, fpId: fpId(store.getState()) });
ok("and the completeness invariant stays quiet about it, by design", c2.ok,
   c2.missing.map((c) => c.cardId).join(","));

const r = document.createElement("div");
r.id = "result"; r.className = fail === 0 ? "pass" : "fail";
r.textContent = fail === 0 ? `RESULT: ALL PASS (${pass})` : `RESULT: ${fail} FAILED of ${pass + fail}`;
document.body.appendChild(r);
</script></body></html>
